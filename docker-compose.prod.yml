services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - ecashengine_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  import-legacy-data:
    image: ecashengine-backend-prod
    build:
      context: ./backend
      target: prod
    command: node scripts/import-postgres.mjs
    restart: "no"
    volumes:
      - ./:/host-data
      - ecashengine_prod_uploads:/legacy-uploads:ro
    env_file:
      - ./.env.production
      - path: ./backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      HOST_DATA_DIR: /host-data
      LEGACY_UPLOAD_DIR: /legacy-uploads
      PGHOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ecashengine-backend-prod
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "4105:4000"
    volumes:
      - ./:/host-data
    env_file:
      - path: ./backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_PATH: /host-data/db.sqlite3
      UPLOAD_DIR: /host-data/media
      REDIS_URL: redis://redis:6379
      GENERATION_TIMEZONE: ${GENERATION_TIMEZONE:-Europe/Sofia}
    depends_on:
      redis:
        condition: service_healthy
      import-legacy-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: ecashengine-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL}
      VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    ports:
      - "8100:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ecashengine_prod_postgres_data:
  ecashengine_prod_uploads:
