services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ecashengine-backend-dev
    build:
      context: ./backend
      target: dev
    ports:
      - "4000:4000"
    volumes:
      - ./:/host-data
    env_file:
      - ./.env
    environment:
      DATABASE_PATH: /host-data/db.sqlite3
      UPLOAD_DIR: /host-data/media
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      GENERATION_TIMEZONE: Europe/Sofia
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: ecashengine-frontend-dev
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    depends_on:
      backend:
        condition: service_healthy

  admin-seed:
    image: ecashengine-backend-dev
    volumes:
      - ./:/host-data
    env_file:
      - ./.env
    environment:
      DATABASE_PATH: /host-data/db.sqlite3
      LOCAL_SUPERADMIN_EMAIL: ${LOCAL_SUPERADMIN_EMAIL:-admin@ecashengine.local}
      LOCAL_SUPERADMIN_PASSWORD: ${LOCAL_SUPERADMIN_PASSWORD:-MySecretPassword123!}
    command: npm run create-superadmin
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
